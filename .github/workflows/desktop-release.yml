name: CD For SiYuan Unlock
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true
      packageManager:
        description: "pnpm@x.x.x"
        required: true

jobs:
  prepare-ui:
    name: build UI once
    runs-on: ubuntu-22.04
    steps:
      - name: Verify official repository
        shell: bash
        env:
          OFFICIAL_BUILD_MARKER: ${{ secrets.SIYUAN_UNLOCK_OFFICIAL_BUILD }}
        run: |
          if [[ "${GITHUB_REPOSITORY}" == "appdev/siyuan-unlock" ]]; then
            if [[ -z "${OFFICIAL_BUILD_MARKER}" ]]; then
              echo "::error::The official repository requires SIYUAN_UNLOCK_OFFICIAL_BUILD."
              exit 1
            fi
          elif [[ "${GITHUB_REPOSITORY}" != "snow212-cn/siyuan-unlock" ]]; then
            echo "::error::This release workflow is only enabled for the official repository or the configured maintenance fork."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        shell: bash
        run: |
          set -euo pipefail
          workspace="${{ github.workspace }}"
          cd "${workspace}/siyuan-note/"
          git clone --branch "${{ github.event.inputs.version }}" --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan
          git apply "${workspace}/siyuan-note/patches/siyuan/disable-update.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/default-config.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/mock-vip-user.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/hide-account-entry.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/first-launch-notice.patch"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node pnpm
        run: npm install -g ${{ github.event.inputs.packageManager }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Get pnpm store path
        id: pnpm-store-prepare
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store-prepare.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('siyuan-note/siyuan/app/pnpm-lock.yaml') }}

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Upload UI build
        uses: actions/upload-artifact@v7
        with:
          name: siyuann-ui-${{ github.event.inputs.version }}
          path: ${{ github.workspace }}/siyuan-note/siyuan/app/stage/build
          if-no-files-found: error

  build:
    needs: prepare-ui
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - os: ubuntu-22.04
            kernel_path: "../app/kernel-linux/SiYuan-Kernel"
            build_mode: "-buildmode=pie"
            build_args: "-s -w -extldflags -static-pie -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-linux"
            goos: "linux"
            goarch: "amd64"
            cc_path: "x86_64-linux-musl-cross/bin/x86_64-linux-musl-gcc"
            suffix: "linux.tar.gz"
            deb_suffix: "linux.deb"
          - os: ubuntu-22.04
            kernel_path: "../app/kernel-linux-arm64/SiYuan-Kernel"
            build_mode: "-buildmode=pie"
            build_args: "-s -w -extldflags -static-pie -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-linux-arm64"
            goos: "linux"
            goarch: "arm64"
            cc_path: "aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc"
            suffix: "linux-arm64.tar.gz"
            deb_suffix: "linux-arm64.deb"
          - os: macos-latest
            kernel_path: "../app/kernel-darwin/SiYuan-Kernel"
            build_mode: ""
            build_args: "-s -w -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-darwin"
            goos: "darwin"
            goarch: "amd64"
            suffix: "mac.dmg"
            deb_suffix: ""
          - os: macos-latest
            kernel_path: "../app/kernel-darwin-arm64/SiYuan-Kernel"
            build_mode: ""
            build_args: "-s -w -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-darwin-arm64"
            goos: "darwin"
            goarch: "arm64"
            suffix: "mac-arm64.dmg"
            deb_suffix: ""
          - os: windows-latest
            kernel_path: "../app/kernel/SiYuan-Kernel.exe"
            build_mode: ""
            build_args: "-s -w -H=windowsgui -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist"
            goos: "windows"
            gobin: "bin"
            mingwsys: "MINGW64"
            goarch: "amd64"
            suffix: "win.exe"
            deb_suffix: ""

    steps:
      - name: Verify official repository
        shell: bash
        env:
          OFFICIAL_BUILD_MARKER: ${{ secrets.SIYUAN_UNLOCK_OFFICIAL_BUILD }}
        run: |
          if [[ "${GITHUB_REPOSITORY}" == "appdev/siyuan-unlock" ]]; then
            if [[ -z "${OFFICIAL_BUILD_MARKER}" ]]; then
              echo "::error::The official repository requires SIYUAN_UNLOCK_OFFICIAL_BUILD."
              exit 1
            fi
          elif [[ "${GITHUB_REPOSITORY}" != "snow212-cn/siyuan-unlock" ]]; then
            echo "::error::This release workflow is only enabled for the official repository or the configured maintenance fork."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        shell: bash
        run: |
          set -euo pipefail

          workspace="${{ github.workspace }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            workspace="$(cygpath -u "${workspace}")"
          fi

          mkdir -p "${workspace}/go"
          cd "${workspace}/siyuan-note/"

          git clone --branch "${{ github.event.inputs.version }}" --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply "${workspace}/siyuan-note/patches/siyuan/disable-update.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/default-config.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/mock-vip-user.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/hide-account-entry.patch"
          git apply "${workspace}/siyuan-note/patches/siyuan/first-launch-notice.patch"

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: siyuann-ui-${{ github.event.inputs.version }}
          path: ${{ github.workspace }}/siyuan-note/siyuan/app/stage/build
          git status

      - name: Cache Linux toolchain
        id: musl-cache
        if: contains(matrix.config.goos, 'linux')
        uses: actions/cache@v5
        with:
          path: ~/.cache/siyuan-musl
          key: ${{ runner.os }}-musl-${{ matrix.config.goarch }}

      - name: Download Linux toolchain
        if: contains(matrix.config.goos, 'linux') && steps.musl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.cache/siyuan-musl
          if [ "${{ matrix.config.goarch }}" = "amd64" ]; then
            wget -q https://github.com/appdev/musl-archive/releases/download/latest/x86_64-linux-musl-cross.tgz -O ~/.cache/siyuan-musl/linux-amd64.tgz
          elif [ "${{ matrix.config.goarch }}" = "arm64" ]; then
            wget -q https://github.com/appdev/musl-archive/releases/download/latest/aarch64-linux-musl-cross.tgz -O ~/.cache/siyuan-musl/linux-arm64.tgz
          fi

      - name: Set up Cross Compilation Toolchains for Linux
        if: contains(matrix.config.goos, 'linux')
        shell: bash
        run: |
          sudo mkdir -p /usr/local/musl
          if [ "${{ matrix.config.goarch }}" = "amd64" ]; then
            sudo tar -xzf ~/.cache/siyuan-musl/linux-amd64.tgz -C /usr/local/musl
          elif [ "${{ matrix.config.goarch }}" = "arm64" ]; then
            sudo tar -xzf ~/.cache/siyuan-musl/linux-arm64.tgz -C /usr/local/musl
          fi

      - name: Set up MingGW
        uses: msys2/setup-msys2@v2
        if: contains( matrix.config.goos, 'windows')
        with:
          install: p7zip mingw-w64-x86_64-lua

      - name: Set up TDM-GCC
        run: msys2 -c "bash siyuan-note/siyuan/scripts/get-tdm-gcc.sh tdm https://github.com/jmeubank/tdm-gcc/releases/download/v10.3.0-tdm-1/tdm-gcc-10.3.0.exe" && echo "CC=${{ github.workspace }}/tdm/bin/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if: contains( matrix.config.goarch, '386')
        working-directory: ${{ github.workspace }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"
      - run: go version

      - name: Set up goversioninfo
        run: go get github.com/josephspurrier/goversioninfo/cmd/goversioninfo && go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo
        if: contains( matrix.config.goos, 'windows')
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOPATH: ${{ github.workspace }}/go
          GOARCH: ${{ matrix.config.goarch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node pnpm
        run: npm install -g ${{ github.event.inputs.packageManager }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Get pnpm store path
        id: pnpm-store-matrix
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store-matrix.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('siyuan-note/siyuan/app/pnpm-lock.yaml') }}
      - name: Verify account-free sync
        shell: bash
        working-directory: ${{ github.workspace }}/siyuan-note
        run: bash scripts/check-account-free.sh siyuan

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app


      - name: Generate Icon Resource and Properties/Version Info For Windows
        run: ${{ github.workspace }}\go\${{ matrix.config.gobin }}\goversioninfo -platform-specific=true -icon="resource\icon.ico" -manifest="resource\goversioninfo.exe.manifest"
        if: contains( matrix.config.goos, 'windows')
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel

      - name: Clean Build Directories
        if: contains( matrix.config.goos, 'linux')
        run: |
          rm -rf app/build
          rm -rf app/kernel-linux
          rm -rf app/kernel-linux-arm64
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan

      - name: Building Kernel
        run: go build ${{ matrix.config.build_mode }} --tags "fts5 sqlcipher" -o "${{ matrix.config.kernel_path }}" -v -ldflags "${{ matrix.config.build_args }}"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOPATH: ${{ github.workspace }}/go
          GOARCH: ${{ matrix.config.goarch }}
          GOPROXY: https://proxy.golang.org,direct
          CC: ${{ runner.os == 'Linux' && format('/usr/local/musl/{0}', matrix.config.cc_path) || '' }}

      - name: Verify Linux kernel is static PIE
        if: contains(matrix.config.goos, 'linux')
        shell: bash
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        run: |
          set -euo pipefail
          kernel_path="${{ matrix.config.kernel_path }}"
          file "${kernel_path}"
          build_info="$(go version -m "${kernel_path}")"
          program_headers="$(readelf -lW "${kernel_path}")"
          dynamic_section="$(readelf -dW "${kernel_path}" 2>/dev/null || true)"
          printf '%s\n' "${build_info}"
          printf '%s\n' "${program_headers}"
          printf '%s\n' "${dynamic_section}"

          if grep -Fq ' INTERP ' <<<"${program_headers}"; then
            echo "::error::Linux kernel contains an ELF interpreter"
            exit 1
          fi
          if grep -Fq '(NEEDED)' <<<"${dynamic_section}"; then
            echo "::error::Linux kernel contains dynamic dependencies"
            exit 1
          fi
          grep -F $'build\t-buildmode=pie' <<<"${build_info}"
          grep -F -- '-extldflags -static-pie' <<<"${build_info}"

      - name: Cache Linux Electron downloads
        if: matrix.config.goos == 'linux'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ matrix.config.goarch }}-${{ hashFiles('siyuan-note/siyuan/app/package.json') }}

      - name: Cache macOS Electron downloads
        if: matrix.config.goos == 'darwin'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ matrix.config.goarch }}-${{ hashFiles('siyuan-note/siyuan/app/package.json') }}

      - name: Cache Windows Electron downloads
        if: matrix.config.goos == 'windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ matrix.config.goarch }}-${{ hashFiles('siyuan-note/siyuan/app/package.json') }}
      - name: Building Electron
        run: pnpm run ${{ matrix.config.electron_args }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - uses: joutvhu/get-release@v1
        id: get_current_release
        with:
          tag_name: ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron App
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*-${{ matrix.config.suffix }}
          name: siyuan-unlock-${{ github.event.inputs.version }}-${{ matrix.config.suffix }}
          allowUpdates: true
          omitBody: true
          omitName: true
          tag: ${{ github.event.inputs.version }}
          replacesArtifacts: true

      - name: Upload Linux AppImage
        if: matrix.config.goos == 'linux' && matrix.config.goarch == 'amd64'
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*linux.AppImage
          allowUpdates: true
          omitBody: true
          omitName: true
          tag: ${{ github.event.inputs.version }}
          replacesArtifacts: true
      - name: Upload .deb packages
        if: ${{ matrix.config.deb_suffix != '' }}
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*-${{ matrix.config.deb_suffix }}
          allowUpdates: true
          omitBody: true
          omitName: true
          tag: ${{ github.event.inputs.version }}
          replacesArtifacts: true
